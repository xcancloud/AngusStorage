server:
  port: ${STORAGE_PORT:1800}
  servlet:
    context-path: /

angus:
  core:
    enabled: true
  global:
    cors:
      enabled: true
  api-log:
    enabled: false
  idgen:
    enabled: true
#  plugin:
#    enabled: true
#    storage-type: DISK
#    auto-load: true
#    enable-management-api: true
#    management-api-prefix: /api/plugins
#    enable-security-check: true
  queue:
    scheduling:
      enabled: false
  datasource:
    enabled: true
    commonlink:
      enabled: true
    extra:
      dbType: '@databaseType@'
      hikari:
        readOnly: false
        connectionTestQuery: SELECT 1 FROM DUAL
        poolName: xcanHikariCP
        idleTimeout: 600000
        maxLifetime: 1800000
        maximumPoolSize: 30
        minimumIdle: 10
      entityPackages:
        - cloud.xcan.angus.idgen.entity
        - cloud.xcan.angus.cache.entity
        - cloud.xcan.angus.job.entity
        - cloud.xcan.angus.queue.entity
        - cloud.xcan.angus.sharding.entity
        - cloud.xcan.angus.plugin.entity
        - cloud.xcan.angus.api.commonlink
        - cloud.xcan.angus.core.storage.domain
        - cloud.xcan.angus.core.gm.domain
    mysql:
      schema:
        - schema/mysql/idgen-schema.sql
        - schema/mysql/cache-schema.sql
        - schema/mysql/job-schema.sql
#        - schema/mysql/queue-schema.sql
#        - schema/mysql/sharding-schema.sql
    postgresql:
      schema:
        - schema/postgres/idgen-schema.sql
        - schema/postgres/cache-schema.sql
        - schema/postgres/job-schema.sql
#        - schema/postgres/queue-schema.sql
#        - schema/postgres/sharding-schema.sql
  redis:
    enabled: false

info:
  app:
    name: '@hump.name@'
    editionType: '@editionType@'
    version: '@project.version@'
    artifactId: '@artifactId@'
    instanceId: ${spring.cloud.client.ip-address}:${server.port}
    description: '@project.description@'
    timezone: ${TIMEZONE:Asia/Shanghai}
    profile: '@profile.active@'
    runtime: ${RUNTIME:HOST}
    license: XCan Business License, Version 1.0
    licenseUrl: http://www.xcan.cloud/licenses/XCBL-1.0.txt
    organization: '@organization.name@'
    organizationUrl: '@organization.url@'

spring:
  application:
    name: '@artifactId@'
  profiles:
    active: '@profile.active@'
  messages:
    basename: i18n/messages-infra-spec,i18n/messages-infra-remote,i18n/messages-storage-api,i18n/messages-storage-core,i18n/messages-gm-api
  jackson:
    defaultPropertyInclusion: always
    dateFormat: ${JACKSON_DATE_FORMAT:yyyy-MM-dd HH:mm:ss}
    localeDateFormat: ${JACKSON_LOCALE_DATE_FORMAT:yyyy-MM-dd}
    localeTimeFormat: ${JACKSON_LOCALE_TIME_FORMAT:HH:mm:ss}
    timeZone: ${TIMEZONE:Asia/Shanghai}
    generator:
      write_numbers_as_strings: true
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
    banner-mode: OFF
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      ## @see CoreAutoConfigurer#multipartConfigElement()
      ## mkdir -p /workdata/tmp/upload -> NoSuchFileException: /workdata/tmp/upload/undertow14992992440132119540upload
      # location: ${upload.tmp.dir:/workdata/tmp/upload} # Fix:: java.nio.file.NoSuchFileException: /tmp/undertow.1819.4153244082753775934/undertow6191513646749224630upload
      max-request-size: ${FILE_MAX_SIZE:20GB}
      max-file-size: ${FILE_MAX_SIZE:20GB}
  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  open-api:
    info:
      title: RESTFul API Documentation
      description: >
        AngusStorage OpenAPI Documentation is a comprehensive, standards-compliant technical reference 
        that provides detailed specifications for all API endpoints, including authentication methods, 
        request/response schemas (with JSON/XML examples), HTTP status codes, error handling patterns,
        and interactive testing capabilities through Swagger UI integration, designed to empower developers 
        with version-controlled documentation for seamless third-party system integration.

logging:
  config: classpath:spring-logback.xml
  level:
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.cloud: WARN
    cloud.xcan.angus.api: debug
  file:
    path: ${log.dir:logs}

management:
  endpoints:
    web:
      exposure:
        include:
          - enums
          - systemlog
          - appworkspace
          - health
          - info
          - metrics
          - serviceregistry
  endpoint:
    health:
      show-details: always
      access: read_only
  health:
    ldap:
      enabled: false
